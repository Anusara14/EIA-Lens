<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Anusara14" />
    <meta name="application-name" content="EIA Lens" />
    <meta name="apple-mobile-web-app-title" content="EIA Lens" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ?v= busts browsers' sticky favicon cache when the mark changes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EIA Lens" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EIA Lens: Review. Verify. Track. Environmental Impact Assessment review tool." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%#website",
            "url": "%SITE_URL%",
            "name": "EIA Lens",
            "description": "%SITE_DESCRIPTION%",
            "inLanguage": "en",
            "publisher": { "@id": "%SITE_URL%#author" }
          },
          {
            "@type": "WebApplication",
            "@id": "%SITE_URL%#app",
            "name": "EIA Lens",
            "url": "%SITE_URL%",
            "description": "%SITE_DESCRIPTION%",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Environmental Impact Assessment review",
            "operatingSystem": "Any (runs in a modern web browser)",
            "browserRequirements": "Requires JavaScript and WebGL",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "image": "%SITE_URL%og.png",
            "screenshot": "%SITE_URL%og.png",
            "dateModified": "%SITE_UPDATED%",
            "inLanguage": "en",
            "author": { "@id": "%SITE_URL%#author" },
            "codeRepository": "https://github.com/Anusara14/EIA-Lens",
            "keywords": "EIA review, ESIA review, Environmental Impact Assessment, Environmental Management Plan, EMP, SMART commitments, AERMOD, model audit, Lee and Colley review, environmental planning",
            "featureList": [
              "Ten fixed, reproducible audit rules for EIA and ESIA reports",
              "Lee & Colley-style A–F review-quality grades",
              "Auditability score for impact predictions",
              "Every flag linked to its evidence page in the PDF",
              "3D map of the report's own coordinates with Sentinel-2 overlay",
              "EMP promise ledger with SMART scoring",
              "Runs entirely in the browser; the PDF never leaves your device",
              "Printable A4 review report"
            ]
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%#author",
            "name": "Anusara14",
            "url": "https://github.com/Anusara14",
            "sameAs": ["https://github.com/Anusara14"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--static--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
